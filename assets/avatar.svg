<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Конлуз и фон -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="120" cy="120" r="120" />
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Фоновый круг -->
    <rect width="240" height="240" fill="url(#bgGrad)" />
    
    <!-- Тонкий внутренний контур -->
    <circle cx="120" cy="120" r="115" fill="none" stroke="#333333" stroke-width="2" />

    <!-- Силуэт плеч и торса -->
    <path d="M 35 225 C 35 175, 75 155, 120 155 C 165 155, 205 175, 205 225 Z" 
          fill="#1f1f1f" 
          stroke="#404040" 
          stroke-width="2" />

    <!-- Силуэт головы -->
    <circle cx="120" cy="95" r="45" 
            fill="#1f1f1f" 
            stroke="#404040" 
            stroke-width="2" />
  </g>
</svg>
